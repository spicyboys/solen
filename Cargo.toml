[package]
name = "solen"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-config = { version = "1.10", default-features = false, features = [
    "rt-tokio",
] }
aws-sdk-s3 = { version = "1.132.0", default-features = false, features = [
    "default-https-client",
] }
chrono = "0.4.42"
chrono-tz = "0.10.4"
dotenvy = "0.15.0"
html-to-markdown-rs = "3.10"
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }
rand = "0.10"
regex-lite = "0.1"
reqwest = { version = "0.13", features = ["json", "form"] }
rss = "2.1"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net"] }
tokio-cron-scheduler = "0.15.1"
topcoat = { version = "0.5", features = [
    "tailwind",
    "ui",
    "font-fontsource",
    "icon-iconify",
] }
url = "2.5.8"
serde = "1.0"
serde_json = "1.0"
bytes = "1.12"
config = "0.15.25"
rustls = "0.23.43"
toasty = { version = "0.9.0", features = ["postgresql", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
topcoat = { version = "0.5.0", default-features = false, features = [
    "tailwind",
    "icon-iconify",
] }
